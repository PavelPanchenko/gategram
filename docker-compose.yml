# Все переменные окружения для бэкенда, БД и Celery читаются из backend/.env
# Переменные для фронтенда читаются из frontend/.env.local

services:
  postgres:
    image: postgres:16-alpine
    container_name: gategram_postgres
    env_file:
      - backend/.env
    # Переменные POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB передаются через env_file
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gategram_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gategram_backend
    env_file:
      - backend/.env
    # Все переменные читаются из backend/.env через env_file
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Переменные читаются из frontend/.env.local, который копируется в контейнер
    container_name: gategram_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gategram_celery
    env_file:
      - backend/.env
    # Переменные читаются из backend/.env через env_file
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gategram_celery_beat
    env_file:
      - backend/.env
    # Переменные читаются из backend/.env через env_file
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:

