# Все переменные окружения читаются из .env в корне проекта
# Переменные для фронтенда читаются из frontend/.env.local

services:
  postgres:
    image: postgres:16-alpine
    container_name: gategram_postgres
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # Переменные POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB передаются через env_file
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gategram_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: gategram_backend_node
    env_file:
      - ./.env
    # Все переменные читаются из .env через env_file
    environment:
      - PORT=8001
      - NODE_ENV=production
      # В контейнере имя хоста Redis = "redis"
      - REDIS_URL=redis://redis:6379/0
      # В контейнере имя хоста Postgres = "postgres" (вместо localhost из .env)
      - DATABASE_URL_HOST=postgres
      - DATABASE_URL_PORT=5432
    volumes:
      - backend_media:/app/media
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npm run build
      && export DATABASE_URL=\"$(node -e 'const u=new URL(process.env.DATABASE_URL); if(process.env.DATABASE_URL_HOST) u.hostname=process.env.DATABASE_URL_HOST; if(process.env.DATABASE_URL_PORT) u.port=process.env.DATABASE_URL_PORT; console.log(u.toString());')\"
      && if [ \"${INIT_DB:-0}\" = \"1\" ]; then npx prisma db push --accept-data-loss; fi
      && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Переменные читаются из frontend/.env.local, который копируется в контейнер
    container_name: gategram_frontend
    volumes:
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend-node
    environment:
      - NODE_ENV=production
      # API URL для продакшена (можно переопределить через .env.local или здесь)
      - NEXT_PUBLIC_API_HOST=${NEXT_PUBLIC_API_HOST:-185.253.218.21}
      - NEXT_PUBLIC_API_PORT=${NEXT_PUBLIC_API_PORT:-8001}
      # Или явно задать полный URL (приоритет выше)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    command: sh -c "npm run build && npm start"

volumes:
  postgres_data:
  redis_data:
  backend_media:

